
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Create Account | MediMate AI</title>
    <link rel="stylesheet" href="css/style.css">
    <style>
        .register-wrapper {
            min-height: 85vh;
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 40px 20px;
        }

        .register-card {
            width: 100%;
            max-width: 470px;
            padding: 35px;
            background: #101529;
            border: 1px solid rgba(167,139,250,.2);
            border-radius: 22px;
            box-shadow: 0 20px 70px rgba(0,0,0,.25);
        }

        .register-card h1 {
            font-size: 30px;
            letter-spacing: -1px;
            margin: 12px 0 8px;
        }

        .register-subtitle {
            color: #969db8;
            font-size: 13px;
            margin-bottom: 25px;
        }

        .form-group {
            margin-bottom: 17px;
        }

        .form-group label {
            display: block;
            font-size: 12px;
            color: #d9dcef;
            margin-bottom: 8px;
        }

        .form-group input {
            width: 100%;
            padding: 13px 14px;
            color: #fff;
            background: #080b18;
            border: 1px solid rgba(255,255,255,.12);
            border-radius: 10px;
            outline: none;
            font-size: 13px;
        }

        .form-group input:focus {
            border-color: #8b5cf6;
            box-shadow: 0 0 0 3px rgba(139,92,246,.1);
        }

        .register-submit {
            width: 100%;
            border: none;
            cursor: pointer;
            font-family: inherit;
            margin-top: 7px;
        }

        .register-footer {
            text-align: center;
            margin-top: 22px;
            color: #969db8;
            font-size: 12px;
        }

        .register-footer a {
            color: #b49aff;
            font-weight: 600;
        }

        .register-back {
            display: block;
            text-align: center;
            margin-top: 20px;
            font-size: 12px;
            color: #969db8;
        }

        .form-message {
            font-size: 12px;
            margin-top: 12px;
            color: #fca5a5;
        }

        @media(max-width:480px) {
            .register-card {
                padding: 24px 20px;
            }
        }
    </style>
</head>
<body>

    <nav class="navbar">
        <a href="index.html" class="logo">
            <span class="logo-icon">✚</span>
            MediMate <span class="ai-text">AI</span>
        </a>
        <div class="nav-links">
            <a href="index.html">← Back to Home</a>
        </div>
    </nav>

    <main class="register-wrapper">
        <section class="register-card">
            <div class="status-pill">
                <span class="status-dot"></span>
                YOUR HEALTH JOURNEY STARTS HERE
            </div>

            <h1>Create your account</h1>
            <p class="register-subtitle">
                Set up your personal health space in a few steps.
            </p>

            <form action="RegisterServlet" method="post" id="registerForm">

                <div class="form-group">
                    <label for="fullName">Full Name</label>
                    <input type="text" id="fullName" name="fullName"
                           placeholder="Enter your full name" required
                           maxlength="100" autocomplete="name">
                </div>

                <div class="form-group">
                    <label for="email">Email Address</label>
                    <input type="email" id="email" name="email"
                           placeholder="you@example.com" required
                           maxlength="150" autocomplete="email">
                </div>

                <div class="form-group">
                    <label for="password">Create Password</label>
                    <input type="password" id="password" name="password"
                           placeholder="At least 8 characters" required
                           minlength="8" autocomplete="new-password">
                </div>

                <div class="form-group">
                    <label for="confirmPassword">Confirm Password</label>
                    <input type="password" id="confirmPassword"
                           name="confirmPassword"
                           placeholder="Enter password again" required
                           minlength="8" autocomplete="new-password">
                </div>

                <button type="submit"
                        class="primary-button register-submit">
                    Create My Account →
                </button>

                <p id="formMessage" class="form-message"
                   role="alert"></p>
            </form>

            <div class="register-footer">
                Already have an account?
                <a href="login.html">Login here</a>
            </div>

            <a href="index.html" class="register-back">
                ← Return to MediMate AI
            </a>
        </section>
    </main>

    <footer class="footer">
        <a href="index.html" class="logo">
            <span class="logo-icon">✚</span>
            MediMate <span class="ai-text">AI</span>
        </a>
        <p>Your personal health management, made simpler.</p>
    </footer>

    <script>
        document.getElementById("registerForm")
            .addEventListener("submit", function(event) {
                const password =
                    document.getElementById("password").value;
                const confirmPassword =
                    document.getElementById("confirmPassword").value;
                const message =
                    document.getElementById("formMessage");

                if (password !== confirmPassword) {
                    event.preventDefault();
                    message.textContent = "Passwords do not match.";
                    return;
                }

                message.textContent = "";
            });
    </script>

</body>
</html>
